name: supportopsenv
description: Risk-aware AI customer support execution environment for OpenEnv-style agent training and evaluation.
version: "1.0.0"

entrypoint:
  type: http
  path: /

healthcheck: /health

environment:
  framework: fastapi
  port: 7860

tasks:
  - task_id: easy_password_reset
    difficulty: easy
    name: Password reset triage
    grader: step_reward

  - task_id: medium_billing_dispute
    difficulty: medium
    name: Billing dispute
    grader: step_reward

  - task_id: hard_security_breach
    difficulty: hard
    name: Security breach
    grader: step_reward